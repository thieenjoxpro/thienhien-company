<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; padding: var(--space-8) var(--space-12); background: var(--ground); font-family: var(--font-sans); color: var(--ink); }
  table { width: 480px; border-collapse: collapse; }
  th, td { padding: var(--space-3) 0; text-align: left; border-top: 1px solid var(--line); vertical-align: baseline; }
  tr:last-child th, tr:last-child td { border-bottom: 1px solid var(--line); }
  th { width: 40%; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
  td { font: 400 16px/26px var(--font-mono); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <table>
    <tbody>
      <tr><th scope="row">Mã</th><td>TH-BL03</td></tr>
      <tr><th scope="row">Kích thước</th><td>Ø16 × 100 mm</td></tr>
      <tr><th scope="row">Độ dày</th><td>2,0 mm</td></tr>
      <tr><th scope="row">Vật liệu</th><td>Thép CT3</td></tr>
      <tr><th scope="row">Bề mặt</th><td>Mộc, chưa sơn</td></tr>
      <tr><th scope="row">Đơn vị tính</th><td>Cái</td></tr>
    </tbody>
  </table>
</body>
</html>
